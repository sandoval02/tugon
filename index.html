<head>
<meta charset="utf-8">

<meta name="description" content="TUGON is the emergency response app of Liliw, Laguna. Report incidents, follow responders live, and get alerts. Download for Android and iOS.">
<meta name="theme-color" content="#0B0F14" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#EEF4FC" media="(prefers-color-scheme: light)">

<script>
  // set the theme before first paint (no flash)
  (function () {
    var t;
    try { t = localStorage.getItem("tugon-theme"); } catch (e) {}
    if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
    document.documentElement.dataset.theme = t;
  })();
</script>
</head>
